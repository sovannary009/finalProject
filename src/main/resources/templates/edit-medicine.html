<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Medicine</title>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg">
                <div class="card-body">

                    <h3 class="text-center text-primary mb-4">
                        ✏ Edit Medicine
                    </h3>

                    <form th:action="@{/medicines/update}" 
                          th:object="${medicine}" 
                          method="post">

                        <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text"
                                   th:field="*{category}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number"
                                   step="0.01"
                                   th:field="*{price}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number"
                                   th:field="*{quantity}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Expiry Date</label>
                            <input type="date"
                                   th:field="*{expiryDate}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="/medicines"
                               class="btn btn-secondary">
                                ⬅ Back
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                💾 Update Medicine
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
