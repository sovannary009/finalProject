<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pharmacy Inventory</title>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-primary mb-4">💊 Pharmacy Inventory System</h2>

    <!-- Success Message -->
    <div th:if="${successMessage}" 
         class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search Card -->
<div class="card shadow-sm mb-4">
    <div class="card-body">

        <form th:action="@{/medicines}" method="get" class="row g-3">

            <div class="col-md-4">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       class="form-control"
                       placeholder="Search by name or category">
            </div>

            <div class="col-md-2">
                <button type="submit"
                        class="btn btn-primary w-100">
                    Search
                </button>
            </div>

            <div class="col-md-2">
                <a href="/medicines"
                   class="btn btn-secondary w-100">
                    Clear
                </a>
            </div>

        </form>

    </div>
</div>

    <!-- Add Medicine Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Add New Medicine</h5>

            <form th:action="@{/medicines/save}" method="post" class="row g-3">

                <div class="col-md-3">
                    <input type="text" name="name" 
                           class="form-control" 
                           placeholder="Name" required>
                </div>

                <div class="col-md-2">
                    <input type="text" name="category" 
                           class="form-control" 
                           placeholder="Category" required>
                </div>

                <div class="col-md-2">
                    <input type="number" step="0.01" name="price" 
                           class="form-control" 
                           placeholder="Price" required>
                </div>

                <div class="col-md-2">
                    <input type="number" name="quantity" 
                           class="form-control" 
                           placeholder="Quantity" required>
                </div>

                <div class="col-md-2">
                    <input type="date" name="expiryDate" 
                           class="form-control" required>
                </div>

                <div class="col-md-1">
                    <button type="submit" 
                            class="btn btn-success w-100">
                        Add
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Medicine Table -->
    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Expiry Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="medicine : ${medicines}">

                        <td th:text="${medicine.id}"></td>
                        <td th:text="${medicine.name}"></td>
                        <td th:text="${medicine.category}"></td>
                        <td th:text="${medicine.price}"></td>

                        <!-- Quantity Warning -->
                        <td>
                            <span th:if="${medicine.quantity == 0}" 
                                  class="badge bg-danger">
                                OUT OF STOCK
                            </span>

                            <span th:if="${medicine.quantity > 0}"
                                  th:text="${medicine.quantity}"
                                  th:classappend="${medicine.quantity < 10} ? 
                                  ' text-warning fw-bold' : ''">
                            </span>
                        </td>

                        <!-- Expiry Warning -->
                        <td>
                            <span th:if="${medicine.expiryDate.isBefore(today)}"
                                  class="text-danger fw-bold">
                                EXPIRED
                            </span>

                            <span th:if="${!medicine.expiryDate.isBefore(today)}"
                                  th:text="${medicine.expiryDate}"
                                  th:classappend="${medicine.expiryDate.isBefore(today.plusDays(30))} ? 
                                  ' text-warning fw-bold' : ''">
                            </span>
                        </td>

                        <!-- Actions -->
                        <td>
                            <a th:href="@{/medicines/edit/{id}(id=${medicine.id})}"
                               class="btn btn-sm btn-primary">
                                Edit
                            </a>

                            <a th:href="@{/medicines/delete/{id}(id=${medicine.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to delete this medicine?');">
                                Delete
                            </a>
                        </td>

                    </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
